name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts
      # Unit tests (chunking, citations, PII detection and masking, portfolio planning, radar). The database suites
      # (permissions, audit, review, API, tracing) need the ingested corpus and skip here; they run locally and
      # against the deployed database.
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx next build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image (CPU PyTorch, models baked in)
        run: docker build -t contract-radar-api:ci .
      - name: Smoke test (starts without a database; /healthz answers)
        run: |
          docker run -d --name api -p 8000:8000 contract-radar-api:ci
          for i in $(seq 1 60); do curl -fsS localhost:8000/healthz && exit 0; sleep 2; done
          docker logs api; exit 1
      - name: Image size
        run: docker image ls contract-radar-api:ci
