[project]
name = "contract-copilot"
version = "0.1.0"
description = "Permission-aware RAG over a contract portfolio, with verified citations and evals"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    "rapidfuzz>=3.9",
    "python-dotenv>=1.0",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contract_copilot"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["src"]
